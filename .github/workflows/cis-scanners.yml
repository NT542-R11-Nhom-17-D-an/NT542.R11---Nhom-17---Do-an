
name: CIS 1.5 & 2.1 Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secret-scanner:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (CIS 1.5.1)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-pipeline-scanner:
    name: Actionlint CI Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Actionlint (CIS 1.5.2)
        uses: reviewdog/action-actionlint@v1

  trivy-comprehensive-scanner:
    name: Trivy Security Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy (CIS 1.5.3 - 1.5.6)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scanners: "vuln,misconfig,secret,license"
          scan-ref: "."
